            justify-content: space-between;

            border: none; 
            border-radius: 20px; 
            background: white; 
            color: #f57c00;
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.3s ease, background 0.3s ease; 
            font-size: 14px;
        }
        .chat-header .btn-group button:hover { 
            transform: scale(1.05); 
            background: #fff3e0;
            color: #ef6c00;
        }

        }

            border-radius: 20px; 
            background: #f57c00;
            color: white; 
            font-weight: bold; 
            cursor: pointer;

        }

            color: black; 
            width: 200px;

            gap: 10px;

            color: white;

        async function initializeMap() {
            try {
                map = L.map('map').setView([20.5937, 78.9629], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                userLocation = await getUserLocation();
                L.marker(userLocation).addTo(map).bindPopup("You are here").openPopup();
                map.setView(userLocation, 13);
                addBotMessage(translations[language].locationDetected.replace('{lat}', userLocation[0].toFixed(4)).replace('{lon}', userLocation[1].toFixed(4)));
            } catch (error) {
                console.error("Geolocation error:", error);
                userLocation = [20.5937, 78.9629];
                L.marker(userLocation).addTo(map).bindPopup("Default Location (India Center)").openPopup();
                addBotMessage(translations[language].locationError);
            }
        }

        function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("Geolocation not supported."));
                } else {
                    navigator.geolocation.getCurrentPosition(
                        position => resolve([position.coords.latitude, position.coords.longitude]),
                        error => reject(error),
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                }
            });
        }

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            const userMessage = document.createElement('div');
            userMessage.className = 'message user-message';
            userMessage.textContent = message;
            chatBox.appendChild(userMessage);
            processMessage(message);
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function processMessage(message) {
            const msgLower = message.toLowerCase();
            console.log(`Processing: ${msgLower}, State: ${state}`);
            try {
                switch (true) {
                    case msgLower === 'hi':
                        resetState();
                        addBotMessage(translations[language].hi);
                        showDatePicker('start');
                        updateProgress(10);
                        break;
                    case msgLower === 'show timetable':
                        if (tripData.schedule.length) await displayAdvancedTimetable();
                        else addBotMessage(translations[language].noTrip);
                        break;
                    case msgLower === 'optimize':
                        await optimizeBudgetAndRoute();
                        break;
                    case msgLower === 'budget check':
                        checkBudget();
                        break;
                    case msgLower === 'weather':
                        await checkWeather();
                        break;
                    case msgLower === 'set location':
                        addBotMessage(translations[language].setLocationPrompt);
                        state = 'awaiting_location';
                        break;
                    default:
                        if (state === 'awaiting_location') {
                            processManualLocation(msgLower);
                        } else {
                            handleStateMachine(msgLower);
                        }
                }
            } catch (error) {
                console.error("Error in processMessage:", error);
                addBotMessage("Oops, something broke! Try ‘reset’. 😕");
            }
        }

        function processManualLocation(msgLower) {
            const [latStr, lonStr] = msgLower.split(',').map(s => s.trim());
            const lat = parseFloat(latStr);
            const lon = parseFloat(lonStr);
            if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                addBotMessage("Invalid coordinates! Use 'lat,lon' (e.g., 19.0760,72.8777). Try again.");
                return;
            }
            userLocation = [lat, lon];
            if (map) {
                map.setView(userLocation, 13);
                L.marker(userLocation).addTo(map).bindPopup("Your Manual Location").openPopup();
            }
            addBotMessage(translations[language].locationDetected.replace('{lat}', lat.toFixed(4)).replace('{lon}', lon.toFixed(4)));
            state = 'awaiting_start_date';
        }

        function handleStateMachine(msgLower) {
            console.log(`State: ${state}, Input: ${msgLower}`);
            try {
                if (state === 'awaiting_start_date') showDatePicker('start');
                else if (state === 'awaiting_end_date') showDatePicker('end');
                else if (state === 'awaiting_budget') processBudget(msgLower);
                else if (state === 'awaiting_travel_style') showTravelStyleOptions();
                else if (state === 'awaiting_num_members') processNumMembers(msgLower);
                else if (state === 'awaiting_destinations') processDestinations(msgLower);
                else if (state === 'awaiting_transport') showTransportOptions();
                else if (state === 'awaiting_accommodation') showAccommodationOptions();
                else if (state === 'awaiting_food') showFoodOptions();
                else if (state === 'awaiting_start_time') showTimePicker('start');
                else if (state === 'awaiting_end_time') showTimePicker('end');
                else if (state === 'done') handleDoneState(msgLower);
                else if (state === 'editing') handleEditingState(msgLower);
                else addBotMessage(translations[language].reset);
            } catch (error) {
                console.error("State error:", error);
                addBotMessage("Planning glitch! Try ‘reset’. 😕");
            }
        }

        async function generateAdvancedSchedule() {
            console.log("Generating schedule...");
            try {
                tripData.schedule = [];
                tripData.optimizedRoute = optimizeRoute();

                if (!tripData.optimizedRoute.length) {
                    addBotMessage(translations[language].noTrip);
                    throw new Error("No optimized route generated.");
                }

                if (!tripData.startDate || !tripData.endDate || !tripData.startTime || !tripData.endTime) {
                    addBotMessage(translations[language].noTrip);
                    state = 'awaiting_start_date';
                    return;
                }

                const totalTripDays = Math.floor((tripData.endDate - tripData.startDate) / (1000 * 60 * 60 * 24)) + 1;
                if (totalTripDays <= 0) {
                    addBotMessage(translations[language].invalidEndDate);
                    state = 'awaiting_end_date';
                    showDatePicker('end');
                    return;
                }

                const startTimeMinutes = timeToMinutes(tripData.startTime);
                const endTimeMinutes = timeToMinutes(tripData.endTime);
                if (endTimeMinutes <= startTimeMinutes) {
                    addBotMessage(translations[language].invalidTime);
                    state = 'awaiting_end_time';
                    showTimePicker('end');
                    return;
                }

                const daysPerDest = Math.floor(totalTripDays / tripData.destinations.length);
                const remainder = totalTripDays % tripData.destinations.length;
                tripData.destinations.forEach((dest, i) => {
                    tripData.customDurations[dest] = daysPerDest + (i < remainder ? 1 : 0);
                });

                let currentLocation = userLocation || [20.5937, 78.9629];
                let currentDate = new Date(tripData.startDate);

                for (const dest of tripData.optimizedRoute) {
                    const destCoords = destinations[dest].coords;
                    const distance = calculateDistanceFromCoords(currentLocation, [destCoords.lat, destCoords.lon]);
                    const travelTimeHours = distance / (transportOptions[tripData.transportMode]?.speed || 60);
                    const days = tripData.customDurations[dest] || 1;
                    const weather = await getRealWeather(dest, currentDate);
                    const activities = getDynamicActivities(dest, days, weather);
                    const costs = calculateCosts(dest, days, distance);

                    let hourlySchedule = [];
                    let travelTimeRemaining = travelTimeHours * 60;

                    for (let day = 0; day < days; day++) {
                        let dayDate = new Date(currentDate);
                        dayDate.setDate(currentDate.getDate() + day);

                        if (dayDate > tripData.endDate) break;

                        let currentTime = startTimeMinutes;
                        let dailyEndTime = endTimeMinutes;

                        if (dayDate.toDateString() === tripData.endDate.toDateString()) {
                            dailyEndTime = Math.min(endTimeMinutes, timeToMinutes(tripData.endTime));
                        }

                        const dailySchedule = {};

                        if (day === 0 && travelTimeRemaining > 0) {
                            let travelTimeUsed = Math.min(travelTimeRemaining, dailyEndTime - currentTime);
                            if (travelTimeUsed > 0) {
                                const travelEndTime = currentTime + travelTimeUsed;
                                dailySchedule[minutesToTime(currentTime)] = `Traveling to ${destinations[dest].name}`;
                                currentTime = travelEndTime;
                                travelTimeRemaining -= travelTimeUsed;
                            }
                        }

                        const mealTimes = [
                            { time: '12:00', activity: 'Lunch' },
                            { time: '20:00', activity: 'Dinner' }
                        ].filter(meal => {
                            const mealMinutes = timeToMinutes(meal.time);
                            return mealMinutes >= startTimeMinutes && mealMinutes <= dailyEndTime;
                        });

                        mealTimes.forEach(meal => {
                            dailySchedule[meal.time] = meal.activity;
                        });

                        const activitiesPerDay = Math.ceil(activities.length / days);
                        const dayActivities = activities.slice(day * activitiesPerDay, (day + 1) * activitiesPerDay);

                        for (const activity of dayActivities) {
                            const activityDurationMinutes = activity.duration * 60;
                            if (currentTime + activityDurationMinutes <= dailyEndTime) {
                                const startTimeStr = minutesToTime(currentTime);
                                dailySchedule[startTimeStr] = activity.name;
                                currentTime += activityDurationMinutes;
                            }
                        }

                        Object.keys(dailySchedule).sort((a, b) => timeToMinutes(a) - timeToMinutes(b)).forEach(time => {
                            const scheduleTimeMinutes = timeToMinutes(time);
                            if (scheduleTimeMinutes >= startTimeMinutes && scheduleTimeMinutes <= dailyEndTime) {
                                const activity = dailySchedule[time];
                                const activityObj = activities.find(act => act.name === activity) || { cost: 0, duration: 1 };
                                hourlySchedule.push({
                                    date: dayDate.toISOString().split('T')[0],
                                    time: time,
                                    activity: activity,
                                    destination: dest,
                                    cost: activityObj.cost,
                                    duration: activityObj.duration
                                });
                            }
                        });
                    }

                    tripData.schedule.push({
                        startDate: new Date(currentDate),
                        endDate: new Date(Math.min(currentDate.getTime() + (days - 1) * 24 * 60 * 60 * 1000, tripData.endDate.getTime())),
                        destination: dest,
                        days: days,
                        hourlySchedule: hourlySchedule,
                        costs: costs,
                        travelTime: travelTimeHours.toFixed(1) + ' hrs',
                        weather: weather
                    });

                    currentDate.setDate(currentDate.getDate() + days);
                    currentLocation = [destCoords.lat, destCoords.lon];
                }

                tripData.schedule = tripData.schedule.map(item => {
                    item.hourlySchedule = item.hourlySchedule.filter(entry => {
                        const entryDate = new Date(entry.date);
                        if (entryDate.toDateString() === tripData.endDate.toDateString()) {
                            return timeToMinutes(entry.time) <= timeToMinutes(tripData.endTime);
                        }
                        return true;
                    });
                    return item;
                }).filter(item => item.hourlySchedule.length > 0);

                console.log("Schedule generated:", tripData.schedule);
                state = 'done';
                await displayAdvancedTimetable();
                addBotMessage(translations[language].done);
            } catch (err) {
                console.error("Schedule generation error:", err);
                addBotMessage("Failed to generate schedule! Try again. 😕");
            }

        function timeToMinutes(time) {
            if (!time) return 0;
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function minutesToTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        function getDynamicActivities(dest, days, weather) {
            let acts = destinations[dest]?.activities || [];
            if (weather.toLowerCase().includes('rain')) {
                acts = [...acts, { name: 'Indoor Exploration', duration: 2, cost: 200 }];
            }
            return acts.slice(0, Math.min(days * 2, acts.length));
        }

        async function getRealWeather(dest, date) {
            try {
                const coords = destinations[dest].coords;
                const apiKey = 'YOUR_OPENWEATHERMAP_API_KEY'; // Replace with your actual API key
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=${coords.lat}&lon=${coords.lon}&appid=${apiKey}&units=metric`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Weather API error');
                const data = await response.json();
                const temp = Math.round(data.main.temp);
                const condition = data.weather[0].description;
                return `${condition.charAt(0).toUpperCase() + condition.slice(1)}, ${temp}°C`;
            } catch (error) {
                console.error("Weather fetch error:", error);
                return "Sunny, 25°C";
            }
        }

        function calculateCosts(dest, days, distance) {
            const transportCost = tripData.customCosts[dest]?.transport || (distance * (transportOptions[tripData.transportMode]?.cost || 10) * tripData.numMembers);
            const accommodationCost = tripData.customCosts[dest]?.accommodation || ((accommodationOptions[tripData.accommodation] || 1000) * days * tripData.numMembers);
            const foodCost = tripData.customCosts[dest]?.food || ((foodOptions[tripData.foodPreference] || 300) * days * tripData.numMembers);
            const activities = getDynamicActivities(dest, days, tripData.schedule.find(item => item.destination === dest)?.weather || 'Sunny, 25°C');
            const activityCost = activities.reduce((sum, act) => sum + (act.cost * tripData.numMembers), 0);
            return { transport: transportCost, accommodation: accommodationCost, food: foodCost, activities: activityCost };
        }

        function optimizeRoute() {
            if (!tripData.destinations.length) return [];
            const unvisited = [...tripData.destinations];
            const route = [unvisited.shift()];
            while (unvisited.length) {
                const last = route[route.length - 1];
                const nextDest = unvisited.reduce((closest, curr) => {
                    const distToCurr = calculateDistance(last, curr);
                    const distToClosest = calculateDistance(last, closest);
                    return distToCurr < distToClosest ? curr : closest;
                }, unvisited[0]);
                route.push(nextDest);
                unvisited.splice(unvisited.indexOf(nextDest), 1);
            }
            return route;
        }

        async function optimizeBudgetAndRoute() {
            if (!tripData.destinations.length) {
                addBotMessage(translations[language].noTrip);
                return;
            }
            try {
                tripData.transportMode = 'public';
                tripData.accommodation = 'budget';
                tripData.foodPreference = 'street';
                tripData.optimizedRoute = optimizeRoute();
                await generateAdvancedSchedule();
                let totalCost = tripData.schedule.reduce((sum, item) => sum + Object.values(item.costs).reduce((s, c) => s + c, 0), 0);

                if (totalCost > tripData.budget) {
                    const scale = tripData.budget / totalCost;
                    tripData.schedule.forEach(item => {
                        item.days = Math.max(1, Math.floor(item.days * scale));
                        item.costs.transport = calculateCosts(item.destination, item.days, calculateDistanceFromCoords(userLocation || [20.5937, 78.9629], [destinations[item.destination].coords.lat, destinations[item.destination].coords.lon])).transport;
                        item.costs.accommodation = accommodationOptions['budget'] * item.days * tripData.numMembers;
                        item.costs.food = foodOptions['street'] * item.days * tripData.numMembers;
                        item.costs.activities = getDynamicActivities(item.destination, item.days, item.weather).reduce((sum, act) => sum + (act.cost * tripData.numMembers), 0);
                        item.endDate = new Date(item.startDate);
                        item.endDate.setDate(item.startDate.getDate() + item.days - 1);
                    });
                }

                await generateAdvancedSchedule();
                addBotMessage(translations[language].optimize);
            } catch (err) {
                console.error("Optimization error:", err);
                addBotMessage("Failed to optimize! Try again. 😕");
            }
        }

        function calculateDistance(dest1, dest2) {
            if (!destinations[dest1] || !destinations[dest2]) return 100;
            const c1 = destinations[dest1].coords;
            const c2 = destinations[dest2].coords;
            const R = 6371;
            const dLat = (c2.lat - c1.lat) * Math.PI / 180;
            const dLon = (c2.lon - c1.lon) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(c1.lat * Math.PI / 180) * Math.cos(c2.lat * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function calculateDistanceFromCoords(coord1, coord2) {
            const R = 6371;
            const dLat = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLon = (coord2[1] - coord1[1]) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(coord1[0] * Math.PI / 180) * Math.cos(coord2[0] * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function generatePackingList() {
            if (!tripData.schedule.length) {
                addBotMessage(translations[language].noTrip);
                return;
            }
            let list = `<h3>${translations[language].packingList}</h3><ul>`;
            const items = ['Clothes', 'Toiletries', 'Charger', 'ID Proof'];
            tripData.schedule.forEach(item => {
                if (item.weather.toLowerCase().includes('rain')) items.push('Raincoat');
            });
            list += [...new Set(items)].map(i => `<li>${i}</li>`).join('');
            list += '</ul>';
            addBotMessage(list);
        }

        async function smartSuggest() {
            if (!tripData.budget || !tripData.travelStyle || (tripData.travelStyle !== 'solo' && !tripData.numMembers)) {
                addBotMessage("Set budget, travel style, and number of members first! Start with ‘hi’. 😊");
                return;
            }
            try {
                const filteredDests = Object.keys(destinations)
                    .filter(d => destinations[d].activities.reduce((sum, act) => sum + act.cost, 0) * tripData.numMembers <= tripData.budget / 3)
                    .slice(0, 3);
                if (!filteredDests.length) {
                    addBotMessage("No destinations match! Adjust budget or style. 😕");
                    return;
                }
                tripData.destinations = filteredDests;
                tripData.startDate = tripData.startDate || new Date();
                tripData.endDate = tripData.endDate || new Date(tripData.startDate.getTime() + 2 * 24 * 60 * 60 * 1000);
                tripData.startTime = tripData.startTime || '09:00';
                tripData.endTime = tripData.endTime || '18:00';
                tripData.transportMode = tripData.transportMode || 'public';
                tripData.accommodation = tripData.accommodation || 'budget';
                tripData.foodPreference = tripData.foodPreference || 'street';
                await generateAdvancedSchedule();
                addBotMessage(`Suggested: ${filteredDests.map(d => destinations[d].name).join(', ')}! 🌟`);
            } catch (err) {
                console.error("Smart suggest error:", err);
                addBotMessage("Failed to suggest! Try again. 😕");
            }
        }

        function toggleLanguage() {
            language = language === 'en' ? 'mr' : 'en';
            addBotMessage(translations[language].languageSwitch.replace('{lang}', language === 'en' ? 'English' : 'Marathi'));
            chatBox.innerHTML = `<div class="message bot-message">${translations[language].welcome}</div><div class="progress-bar"><div class="progress" id="progress" style="width: ${progressBar.style.width};"></div></div>`;
            updateProgress(0);
        }

        function updateProgress(percent) {
            progressBar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
        }

        function quickSelectHandler() {
            const value = document.getElementById('quickSelect').value;
            if (value) {
                userInput.value = value;
                sendMessage();
                document.getElementById('quickSelect').selectedIndex = 0;
            }
        }

        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') sendMessage();
        });

        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');

        document.addEventListener('DOMContentLoaded', () => {
            initializeMap().catch(err => {
                console.error("Map initialization failed:", err);
                addBotMessage("Map failed to load! Try refreshing. 😕");
            });
        });
    </script>
</body>
</html>
